apiVersion: batch/v1
kind: Job
metadata:
  name: sample-gpu-workload
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: cuda-vector-add
          image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
          resources:
            limits:
              nvidia.com/gpu: "1"
