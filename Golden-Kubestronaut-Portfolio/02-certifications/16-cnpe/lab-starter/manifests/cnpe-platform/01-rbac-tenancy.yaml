apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-a-deployer
  namespace: team-a-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-a-workload-admin
  namespace: team-a-prod
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "services", "configmaps", "deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-a-workload-admin-binding
  namespace: team-a-prod
subjects:
  - kind: ServiceAccount
    name: team-a-deployer
    namespace: team-a-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: team-a-workload-admin
