apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceclaims.platform.example.io
spec:
  group: platform.example.io
  scope: Namespaced
  names:
    plural: serviceclaims
    singular: serviceclaim
    kind: ServiceClaim
    shortNames:
      - svcclaim
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [serviceName, owner, tier]
              properties:
                serviceName:
                  type: string
                owner:
                  type: string
                tier:
                  type: string
                  enum: [bronze, silver, gold]
                runtime:
                  type: string
                exposure:
                  type: string
                  enum: [internal, external]
