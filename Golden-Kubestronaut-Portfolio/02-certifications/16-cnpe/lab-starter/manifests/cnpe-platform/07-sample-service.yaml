apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: team-a-prod
  labels:
    app: payments-api
    owner: team-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        owner: team-a
    spec:
      serviceAccountName: team-a-deployer
      containers:
        - name: api
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: team-a-prod
  labels:
    owner: team-a
spec:
  selector:
    app: payments-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
