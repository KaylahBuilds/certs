apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-reader
  namespace: kcsa-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-observer
  namespace: kcsa-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-observer-binding
  namespace: kcsa-dev
subjects:
  - kind: ServiceAccount
    name: app-reader
    namespace: kcsa-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-observer
